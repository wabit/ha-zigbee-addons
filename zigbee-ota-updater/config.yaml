name: "Zigbee OTA Updater"
version: "1.2.3"
slug: "zigbee_ota_updater"
description: "Sequentially updates Zigbee2MQTT devices over OTA, one at a time, to avoid overwhelming your mesh."
url: "https://github.com/wabit/wabits-ha-addons"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: "application"
boot: "auto"
homeassistant_api: true
map:
  - share:rw

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  zigbee2mqtt_topic: "zigbee2mqtt"
  delay_between_updates: 300
  delay_between_checks: 10
  update_timeout: 3600
  check_interval_hours: 24
  enable_notifications: true
  debug: false
  devices: []

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  zigbee2mqtt_topic: str
  delay_between_updates: int
  delay_between_checks: int
  update_timeout: int
  check_interval_hours: int
  enable_notifications: bool
  debug: bool
  devices:
    - str
