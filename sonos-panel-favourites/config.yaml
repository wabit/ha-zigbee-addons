name: "Sonos Panel Favourites"
version: "1.2.0"
slug: "sonos_panel_favourites"
description: "Manage a list of Sonos playlist/radio favourites and serve them as JSON for an ESP32 touch panel."
url: "https://github.com/wabit/wabits-ha-addons"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: "application"
boot: "auto"
# The direct, fixed host port is the hard requirement: the ESP32 panel
# fetches http://<ha-host>:8099/favourites.json over plain HTTP with no
# auth (it has no way to hold an HA auth token), so this endpoint must
# NOT be ingress-only.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Web GUI + public /favourites.json feed for the panel"
# Ingress is a bonus so the config GUI is also reachable from the HA
# sidebar. The direct port above remains available regardless.
ingress: true
ingress_port: 8099
panel_icon: "mdi:playlist-music"
# Grants a SUPERVISOR_TOKEN so the add-on can fetch HA's real Area registry
# (src/ha.ts) and discover automations tagged with the "sonos_favourite"
# Label (src/discover.ts) via the Supervisor-proxied WebSocket/REST API.
# Both fall back gracefully (free-text room input / sync disabled) if this
# is ever unset.
homeassistant_api: true

options:
  # Used to build full webhook URLs for automations discovered via the
  # "Sync from HA" button - the add-on only ever learns a webhook_id from
  # HA's automation config, not an externally-reachable base URL.
  ha_base_url: "http://homeassistant.local:8123"

schema:
  ha_base_url: str
