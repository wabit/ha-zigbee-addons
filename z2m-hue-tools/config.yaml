name: "Z2M Hue Tools"
version: "1.1.0"
slug: "z2m_hue_tools"
description: "Applies hue_native_control and Hue power-on-behavior settings to Signify/Philips Hue lights and their groups in Zigbee2MQTT."
url: "https://github.com/wabit/wabits-ha-addons"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: "application"
boot: "auto"
homeassistant_api: true
map:
  - share:rw

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  zigbee2mqtt_topic: "zigbee2mqtt"
  apply_hue_native_control: false
  hue_native_control: true
  apply_power_on_behavior: true
  hue_power_on_behavior: "previous"
  apply_power_on_brightness: false
  hue_power_on_brightness: "previous"
  apply_power_on_color_temperature: false
  hue_power_on_color_temperature: "previous"
  apply_power_on_color: false
  hue_power_on_color: ""
  apply_to_groups: true
  devices: []
  check_interval_hours: 24
  enable_notifications: true
  dry_run: false
  debug: false

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  zigbee2mqtt_topic: str
  apply_hue_native_control: bool
  hue_native_control: bool
  apply_power_on_behavior: bool
  hue_power_on_behavior: list(default|on|off|toggle|previous)
  apply_power_on_brightness: bool
  hue_power_on_brightness: str
  apply_power_on_color_temperature: bool
  hue_power_on_color_temperature: str
  apply_power_on_color: bool
  hue_power_on_color: str
  apply_to_groups: bool
  devices:
    - str
  check_interval_hours: int
  enable_notifications: bool
  dry_run: bool
  debug: bool
